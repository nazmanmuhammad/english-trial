const CHEATS = [
  {title:'Introduction & Professional Identity', rules:['Subject pronouns: I, you, he, she, it, we, they.','To be: I am; he/she/it is; you/we/they are.','Negative: subject + am/is/are + not. Question: Am/Is/Are + subject...?','Use a formal introduction with clients and managers.'], examples:['I am from Finance.','She is not the manager.','Which department are you in?']},
  {title:'Numbers, Schedules & Dates', rules:['Use on for days/dates, at for exact times, and in for months/years/parts of the day.','Phone numbers are usually read digit by digit; double/triple can describe repeated digits.','Quarter past = 15 minutes after; half past = 30 minutes after; quarter to = 15 minutes before.'], examples:['The meeting is on Monday.','We start at 8 AM.','My birthday is in August.']},
  {title:'Workspace & Directions', rules:['A/an depends on sound: an hour, a university. Use the for a specific known item.','This/these = near; that/those = far. Singular uses this/that; plural uses these/those.','There is + singular/uncountable noun; there are + plural noun.','Place: in a drawer, on a shelf, between two things, opposite = across from.'], examples:['There is a printer.','There are two printers.','Could you tell me the way to the meeting room?']},
  {title:'Describing Job Functions', rules:['Present Simple describes routines, facts, and job responsibilities.','He/she/it takes verb + s/es: works, goes, fixes. I/you/we/they use the base verb.','Negative: do not/does not + V1. Question: Do/Does + subject + V1?','Frequency adverbs usually go before a main verb, but after to be.'], examples:['She writes the minutes.','Does he approve the budget?','They are never late.']},
  {title:'Polite Requests & Hospitality', rules:['Could you… please? is a safe, polite request. Can you…? is more casual.','May I…? asks permission politely. Modal verbs are followed by V1 without “to”.','Would you like + noun / to + verb offers something or an action.','Reception flow: greet, ask/confirm identity, explain waiting, offer hospitality, escort.'], examples:['Could you open the door, please?','May I leave early?','Would you like some coffee?']},
  {title:'Telephoning 1: Incoming Calls', rules:['Pick up = answer; hang up = end; hold on = wait; put through = connect; call back = return a call.','Use the NATO alphabet to make letters clear on calls.','Present Continuous: am/is/are + verb-ing for actions happening now and some fixed future arrangements.','Stative verbs such as know and understand usually do not use -ing.'], examples:['Please hold on a moment.','I will put you through to Finance.','She is having lunch right now.']},
  {title:'Telephoning 2: Handling & Ending Calls', rules:['Subject pronouns: I, he, she, it, we, they. Object pronouns: me, him, her, it, us, them.','Possessive adjective comes before a noun: my desk, her card, our company.','Possessive pronoun stands alone: mine, yours, hers, ours, theirs.','End calls: check if they need anything else, thank them, then give next steps and say goodbye.'], examples:['Please email us.','This laptop is mine.','Could I have your name, please?']},
  {title:'Emailing Basics 1: Format & Salutations', rules:['To = main recipient; CC = people who need to know; BCC = recipients hidden from others.','Use Dear Mr./Ms. + surname for a new client; Hi + first name for a close colleague.','A clear subject often uses [Topic] — [Action/Date].','Capitalize I, sentence beginnings, names, places, months, and days.'], examples:['Subject: Team Meeting — Tuesday 2 PM','Dear Mr. Widodo,','I need the report by Friday.']},
  {title:'Emailing Basics 2: Updates & Plans', rules:['Will often expresses a spontaneous decision, promise, or prediction.','Be going to expresses a prior plan or intention: am/is/are + going to + V1.','Direct Method puts the main point first; AIDA means Attention, Interest, Desire, Action.','Writing process: plan, write, revise/proofread. Use short paragraphs and bullets for skimmers.'], examples:['The phone is ringing. I will answer it.','We are going to open a new branch.','Could you please send the form by today?']},
  {title:'Basic Administration & Cost', rules:['Document flow: quotation (price offer) → purchase order (order) → invoice (payment request) → receipt (proof of payment).','Countable: many people, a few files. Uncountable: much money, some information, some furniture.','Use a piece of / pieces of for uncountable nouns when counting units.','How much asks about price or an uncountable amount.'], examples:['We need some information.','How much is this pen?','The grand total is subtotal plus tax.']},
  {title:'Standard Procedures (SOP)', rules:['Imperative affirmative: V1 + object. Negative: Do not + V1.','Please + V1 softens an instruction; “Let’s + V1” invites the group to act together.','Sequence connectors: First, Next, Then, After that, Finally.','Advice differs from an order: should + V1; suggest + V-ing; recommend + V-ing.'], examples:['Please review the attached document.','Do not share confidential information.','First, turn on the machine.']},
  {title:'Deadlines & Time Management', rules:['By = no later than a deadline. Until = continuing up to a time. Before = earlier than a time.','On the dot = exactly on time; behind schedule = late; ahead of schedule = earlier than planned.','Must expresses strong obligation; mustn’t means prohibited; don’t have to means not necessary.','Must has no ordinary past form; use had to.'], examples:['Submit the report by Friday.','The shop is open until 9 PM.','You don’t have to come early.']},
  {title:'Past Simple: Regular Verbs', rules:['Past Simple describes completed past actions; common time markers include yesterday, last week, and ago.','Regular verbs often add -ed; verbs ending in e add -d; consonant + y changes to -ied.','After did/did not, use the base verb (V1).','-ed can sound /t/, /d/, or /ɪd/ depending on the final sound of the base verb.'], examples:['She checked the document yesterday.','She did not check it.','Did they finish the project?']},
  {title:'Reporting Past Activities', rules:['Many common verbs are irregular: go → went, send → sent, write → wrote.','Positive Past Simple uses V2; negative uses did not + V1; questions use Did + subject + V1.','Use a clear time marker when the past time is finished.'], examples:['I went to the bank yesterday.','She sent the invoice last night.','Did he write the report?']},
  {title:'Creating Recount Text', rules:['A recount retells a past event in time order.','Structure: Orientation (who/when/where) → Events → Re-orientation/conclusion.','Use Past Simple for completed events and sequence words such as First, Then, After that, Finally.'], examples:['Last Tuesday, I went to Bandung.','First, we met the manager. Then, we reviewed the report.','Overall, the trip was productive.']},

    <header class="flex flex-col gap-6 md:flex-row md:items-end md:justify-between">
      <div>
        <span class="inline-flex items-center rounded-full bg-indigo-100 px-3 py-1 text-xs font-semibold text-indigo-700 dark:bg-indigo-500/15 dark:text-indigo-300">General Business English &middot; Level A1</span>
        <h1 class="mt-3 text-3xl font-bold tracking-tight text-slate-900 dark:text-white sm:text-4xl">Latihan Soal Pilihan Ganda</h1>
        <p class="mt-2 max-w-xl text-slate-500 dark:text-slate-400">18 sesi, masing-masing ${TOTAL} soal. Pilih sesi, jawab, dan lihat penjelasan langsung setelah setiap soal.</p>
      </div>
      <div class="grid grid-cols-3 gap-3 text-center md:w-96">
        <div class="rounded-2xl border border-slate-200 bg-white px-3 py-3 dark:border-slate-800 dark:bg-slate-900">
          <div class="text-xl font-bold text-slate-900 dark:text-white">${done}<span class="text-sm font-medium text-slate-400">/18</span></div>
          <div class="text-[11px] uppercase tracking-wide text-slate-400">Sesi dicoba</div>
        </div>
        <div class="rounded-2xl border border-slate-200 bg-white px-3 py-3 dark:border-slate-800 dark:bg-slate-900">
          <div class="text-xl font-bold text-slate-900 dark:text-white">${avg}<span class="text-sm font-medium text-slate-400">%</span></div>
          <div class="text-[11px] uppercase tracking-wide text-slate-400">Rata-rata</div>
        </div>
        <div class="rounded-2xl border border-slate-200 bg-white px-3 py-3 dark:border-slate-800 dark:bg-slate-900">
          <div class="text-xl font-bold text-slate-900 dark:text-white">${18 * TOTAL}</div>
          <div class="text-[11px] uppercase tracking-wide text-slate-400">Total soal</div>
        </div>
      </div>
    </header>

    <div class="mt-8 flex flex-wrap items-center justify-between gap-3 rounded-2xl border border-slate-200 bg-white px-4 py-3 text-sm dark:border-slate-800 dark:bg-slate-900">
      <span class="text-slate-600 dark:text-slate-300">Soal dan pilihan jawaban diacak otomatis setiap kali sesi dimulai.</span>
      <button onclick="resetScores()" class="text-slate-400 transition hover:text-rose-500">Reset skor</button>
    </div>

    <section class="mt-6 grid gap-4 sm:grid-cols-2 lg:grid-cols-3">${cards}</section>

    <p class="mt-10 text-center text-xs text-slate-400">Tip: gunakan tombol keyboard A–D (atau 1–4) untuk menjawab dan Enter untuk lanjut.</p>
  </div>`;
}

function toggleShuffle(v) { data.shuffleQ = v; saveData(); }
function resetScores() {
  if (!confirm('Hapus semua skor terbaik?')) return;
  data.best = {}; saveData(); render();
}

/* ============ QUIZ ============ */
function startQuiz(n, onlyIds) {
  let base = S[n].map((r, i) => ({ id: i, q: r[0], c: r[1], w: r.slice(2, 5), e: r[5] }));
  if (onlyIds) base = base.filter(x => onlyIds.includes(x.id));
  // Always randomize the question order for every new attempt.
  base = shuffle(base);
  st = {
    view: 'quiz', n, retry: !!onlyIds, i: 0, picked: null, fresh: true,
    sessionCode: String(Math.floor(100000 + Math.random() * 900000)),
    ans: [],
    qs: base.map(x => ({
      id: x.id, q: x.q, e: x.e,
      opts: shuffle([{ t: x.c, ok: 1 }].concat(x.w.map(t => ({ t, ok: 0 }))))
    }))
  };
  render();
}

function pick(k) {
  if (st.picked != null) return;
  st.picked = k; st.ans[st.i] = k; st.fresh = false;
  render(true);
}

function nextQ() {
  if (st.picked == null) return;
  if (st.i < st.qs.length - 1) {
    st.i++; st.picked = null; st.fresh = true; render();
  } else finish();
}

function finish() {
  const score = st.qs.reduce((a, q, i) => a + (isOk(q, st.ans[i]) ? 1 : 0), 0);
  st.score = score;
  if (!st.retry) {
    const prev = data.best[st.n];
    if (prev == null || score > prev) { data.best[st.n] = score; saveData(); }
  }
  st.view = 'result';
  render();
}

function quitQuiz() {
  if (st.view === 'quiz' && st.ans.length && !confirm('Keluar dari latihan? Progres sesi ini tidak disimpan.')) return;
  st = { view: 'home' }; render();
}

function quizView() {
  const q = st.qs[st.i];
  const total = st.qs.length;
  const done = st.picked != null;
  const correctSoFar = st.qs.reduce((a, qq, i) => a + (i < st.i || (i === st.i && done) ? (isOk(qq, st.ans[i]) ? 1 : 0) : 0), 0);
  const pct = Math.round((st.i + (done ? 1 : 0)) / total * 100);

  const opts = q.opts.map((o, k) => {
    let box = 'border-slate-200 bg-white hover:border-indigo-400 hover:bg-indigo-50/60 dark:border-slate-800 dark:bg-slate-900 dark:hover:border-indigo-500 dark:hover:bg-slate-800/70';
    let chip = 'bg-slate-100 text-slate-500 dark:bg-slate-800 dark:text-slate-400';
    let extra = '';
    if (done) {
      if (o.ok) { box = 'border-emerald-500 bg-emerald-50 text-emerald-950 dark:border-emerald-500/70 dark:bg-emerald-500/10 dark:text-emerald-100'; chip = 'bg-emerald-500 text-white'; }
      else if (k === st.picked) { box = 'border-rose-500 bg-rose-50 text-rose-950 dark:border-rose-500/70 dark:bg-rose-500/10 dark:text-rose-100'; chip = 'bg-rose-500 text-white'; }
      else { box = 'border-slate-200 bg-white opacity-50 dark:border-slate-800 dark:bg-slate-900'; }
      extra = 'cursor-default';
    }
    const mark = done && o.ok ? '<span class="ml-auto pl-2 text-emerald-600 dark:text-emerald-400">&#10003;</span>'
      : done && k === st.picked ? '<span class="ml-auto pl-2 text-rose-600 dark:text-rose-400">&#10007;</span>' : '';
    return `<button ${done ? 'disabled' : ''} onclick="pick(${k})" class="flex w-full items-start gap-3 rounded-xl border px-4 py-3 text-left text-[15px] leading-snug transition ${box} ${extra}">
      <span class="grid h-7 w-7 shrink-0 place-items-center rounded-lg text-xs font-bold ${chip}">${'ABCD'[k]}</span>
      <span class="pt-0.5">${esc(o.t)}</span>${mark}
    </button>`;
  }).join('');

  const right = done && isOk(q, st.picked);
  const correctTxt = q.opts.find(o => o.ok).t;
  const feedback = done ? `
    <div class="fade mt-5 rounded-xl border px-4 py-3.5 ${right ? 'border-emerald-200 bg-emerald-50 dark:border-emerald-500/30 dark:bg-emerald-500/10' : 'border-rose-200 bg-rose-50 dark:border-rose-500/30 dark:bg-rose-500/10'}">
      <div class="text-sm font-semibold ${right ? 'text-emerald-700 dark:text-emerald-300' : 'text-rose-700 dark:text-rose-300'}">${right ? 'Benar!' : 'Kurang tepat'}</div>
      ${right ? '' : `<div class="mt-1 text-sm text-slate-700 dark:text-slate-200">Jawaban benar: <span class="font-semibold">${esc(correctTxt)}</span></div>`}
      <p class="mt-1 text-sm leading-relaxed text-slate-600 dark:text-slate-300">${esc(q.e)}</p>
    </div>
    <div class="mt-5 flex justify-end">
      <button onclick="nextQ()" class="inline-flex items-center gap-2 rounded-xl bg-indigo-600 px-5 py-2.5 text-sm font-semibold text-white shadow-sm transition hover:bg-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-400 focus:ring-offset-2 dark:focus:ring-offset-slate-950">
        ${st.i === total - 1 ? 'Lihat hasil' : 'Soal berikutnya'} <span aria-hidden="true">&rarr;</span>
      </button>
    </div>` : '';

  return `
  <div class="mx-auto max-w-2xl px-4 pb-16 pt-6 sm:px-6">
    <div class="flex items-center justify-between gap-3">
      <button onclick="quitQuiz()" class="inline-flex items-center gap-1.5 rounded-lg px-2.5 py-1.5 text-sm text-slate-500 transition hover:bg-slate-200/60 hover:text-slate-900 dark:text-slate-400 dark:hover:bg-slate-800 dark:hover:text-white">&larr; Menu</button>
      <div class="truncate text-sm font-medium text-slate-500 dark:text-slate-400">Sesi ${st.n}${st.retry ? ' &middot; Latihan soal salah' : ''} · Kode ${st.sessionCode || '—'}</div>
      <div class="rounded-lg bg-emerald-100 px-2.5 py-1 text-xs font-semibold text-emerald-700 dark:bg-emerald-500/15 dark:text-emerald-300">&#10003; ${correctSoFar}</div>
    </div>

    <div class="mt-4 h-1.5 overflow-hidden rounded-full bg-slate-200 dark:bg-slate-800">
      <div class="h-full rounded-full bg-indigo-500 transition-all duration-500" style="width:${pct}%"></div>
    </div>
    <div class="mt-2 flex items-center justify-between text-xs text-slate-400">
      <span>Soal ${st.i + 1} dari ${total}</span>
      <span class="truncate pl-3">${esc(META[st.n - 1][0])}</span>
    </div>

    <div class="${st.fresh ? 'fade' : ''} mt-5 rounded-2xl border border-slate-200 bg-white p-5 shadow-sm dark:border-slate-800 dark:bg-slate-900 sm:p-7">
      <div class="flex items-start justify-between gap-3"><h2 class="text-lg font-semibold leading-snug text-slate-900 dark:text-white sm:text-xl">${esc(q.q)}</h2><button onclick="openCheat(${st.n})" class="shrink-0 rounded-lg border border-amber-200 bg-amber-50 px-2.5 py-1.5 text-xs font-semibold text-amber-800 hover:bg-amber-100 dark:border-amber-500/30 dark:bg-amber-500/10 dark:text-amber-300">Bingung?</button></div>
      <div class="mt-5 space-y-2.5">${opts}</div>
      ${feedback}
    </div>
  </div>`;
}

/* ============ RESULT ============ */
function resultView() {
  const total = st.qs.length;
  const score = st.score;
  const pct = Math.round(score / total * 100);
  const wrong = st.qs.map((q, i) => ({ q, i })).filter(x => !isOk(x.q, st.ans[x.i]));
  const C = 2 * Math.PI * 52;
  const color = pct >= 75 ? 'stroke-emerald-500' : pct >= 50 ? 'stroke-amber-500' : 'stroke-rose-500';
  const msg = pct >= 90 ? 'Luar biasa! Pemahamanmu sangat kuat.'
    : pct >= 75 ? 'Bagus sekali! Tinggal sedikit lagi untuk sempurna.'
    : pct >= 60 ? 'Cukup baik. Pelajari kembali bagian yang masih salah.'
    : 'Jangan menyerah. Baca ulang materinya, lalu coba lagi.';
  const best = data.best[st.n];

  const review = wrong.map(({ q, i }) => `
    <details class="group rounded-xl border border-slate-200 bg-white dark:border-slate-800 dark:bg-slate-900">
      <summary class="flex cursor-pointer items-start gap-3 px-4 py-3">
        <span class="mt-0.5 grid h-6 w-6 shrink-0 place-items-center rounded-md bg-rose-100 text-xs font-bold text-rose-600 dark:bg-rose-500/15 dark:text-rose-300">${i + 1}</span>
        <span class="flex-1 text-sm font-medium leading-snug text-slate-800 dark:text-slate-100">${esc(q.q)}</span>
        <span class="mt-0.5 text-slate-400 transition group-open:rotate-180">&#9662;</span>
      </summary>
      <div class="space-y-1.5 border-t border-slate-100 px-4 py-3 text-sm dark:border-slate-800">
        <div class="text-rose-600 dark:text-rose-400">Jawabanmu: <span class="font-semibold">${esc(q.opts[st.ans[i]].t)}</span></div>
        <div class="text-emerald-600 dark:text-emerald-400">Jawaban benar: <span class="font-semibold">${esc(q.opts.find(o => o.ok).t)}</span></div>
        <p class="pt-1 leading-relaxed text-slate-500 dark:text-slate-400">${esc(q.e)}</p>
      </div>
    </details>`).join('');

  return `
  <div class="fade mx-auto max-w-2xl px-4 pb-16 pt-10 sm:px-6">
    <div class="rounded-3xl border border-slate-200 bg-white p-7 text-center shadow-sm dark:border-slate-800 dark:bg-slate-900 sm:p-10">
      <div class="text-sm font-medium text-slate-400">Sesi ${st.n}${st.retry ? ' &middot; Latihan soal salah' : ''}</div>
      <h2 class="mt-1 text-xl font-bold text-slate-900 dark:text-white">${esc(META[st.n - 1][0])}</h2>

      <div class="relative mx-auto mt-6 h-40 w-40">
        <svg viewBox="0 0 120 120" class="h-full w-full -rotate-90">
          <circle cx="60" cy="60" r="52" fill="none" stroke-width="10" class="stroke-slate-100 dark:stroke-slate-800"/>
          <circle id="ring" cx="60" cy="60" r="52" fill="none" stroke-width="10" stroke-linecap="round" class="ring-anim ${color}" stroke-dasharray="${C}" stroke-dashoffset="${C}"/>
        </svg>
        <div class="absolute inset-0 grid place-items-center">
          <div>
            <div class="text-4xl font-bold text-slate-900 dark:text-white">${score}<span class="text-xl font-medium text-slate-400">/${total}</span></div>
            <div class="text-sm font-medium text-slate-400">${pct}%</div>
          </div>
        </div>
      </div>

      <p class="mt-5 text-slate-600 dark:text-slate-300">${msg}</p>
      ${!st.retry && best != null ? `<p class="mt-1 text-xs text-slate-400">Skor terbaikmu di sesi ini: ${best}/${TOTAL}</p>` : ''}

      <div class="mt-7 flex flex-col justify-center gap-2.5 sm:flex-row">
        <button onclick="startQuiz(${st.n})" class="rounded-xl bg-indigo-600 px-5 py-2.5 text-sm font-semibold text-white shadow-sm transition hover:bg-indigo-500">Ulangi sesi</button>
        ${wrong.length ? `<button onclick="startQuiz(${st.n}, [${wrong.map(w => w.q.id).join(',')}])" class="rounded-xl border border-indigo-200 bg-indigo-50 px-5 py-2.5 text-sm font-semibold text-indigo-700 transition hover:bg-indigo-100 dark:border-indigo-500/30 dark:bg-indigo-500/10 dark:text-indigo-300 dark:hover:bg-indigo-500/20">Latih ${wrong.length} soal yang salah</button>` : ''}
        ${st.n < 18 ? `<button onclick="startQuiz(${st.n + 1})" class="rounded-xl border border-slate-200 px-5 py-2.5 text-sm font-semibold text-slate-600 transition hover:bg-slate-100 dark:border-slate-700 dark:text-slate-300 dark:hover:bg-slate-800">Sesi ${st.n + 1} &rarr;</button>` : ''}
      </div>
      <button onclick="goHome()" class="mt-4 text-sm text-slate-400 transition hover:text-slate-700 dark:hover:text-slate-200">&larr; Kembali ke menu</button>
    </div>

    ${wrong.length ? `
    <h3 class="mb-3 mt-9 text-sm font-semibold uppercase tracking-wide text-slate-400">Review jawaban salah (${wrong.length})</h3>
    <div class="space-y-2.5">${review}</div>` : `
    <div class="mt-6 rounded-2xl border border-emerald-200 bg-emerald-50 p-5 text-center text-sm font-medium text-emerald-700 dark:border-emerald-500/30 dark:bg-emerald-500/10 dark:text-emerald-300">Semua jawaban benar. Sempurna!</div>`}
  </div>`;
}

function goHome() { cheatReturnState = null; st = { view: 'home' }; render(); }

/* ============ RENDER ============ */
function render(keepScroll) {
  app.innerHTML = navbarView() + (st.view === 'home' ? homeView() : st.view === 'quiz' ? quizView() : st.view === 'cheat' ? cheatView() : resultView());
  if (!keepScroll) window.scrollTo({ top: 0 });
  if (st.view === 'result') {
    const ring = document.getElementById('ring');
    if (ring) {
      const C = 2 * Math.PI * 52;
      requestAnimationFrame(() => requestAnimationFrame(() => {
        ring.setAttribute('stroke-dashoffset', String(C * (1 - st.score / st.qs.length)));
      }));
    }
  }
}

document.addEventListener('keydown', e => {
  if (st.view !== 'quiz' || e.ctrlKey || e.metaKey || e.altKey) return;
  const q = st.qs[st.i];
  if (st.picked == null) {
    const k = 'abcd'.indexOf(e.key.toLowerCase());
    const d = '1234'.indexOf(e.key);
    const idx = k > -1 ? k : d;
    if (idx > -1 && idx < q.opts.length) pick(idx);
  } else if (e.key === 'Enter' || e.key === 'ArrowRight') {
    e.preventDefault(); nextQ();
  }
});

render();
</script>
</body>
</html>
